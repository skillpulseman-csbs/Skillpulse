<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <h1>SkillPulse</h1>
                <p>Choose your learning journey</p>
            </div>
            
            <!-- Role Selection -->
            <div class="role-selector">
                <button class="role-btn active" data-role="student">
                    <span class="role-icon">🎓</span>
                    Student
                </button>
                <button class="role-btn" data-role="mentor">
                    <span class="role-icon">👨‍🏫</span>
                    Mentor
                </button>
                <button class="role-btn" data-role="public">
                    <span class="role-icon">👤</span>
                    Public
                </button>
            </div>
            
            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" required>
                    <label for="email">Email Address</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" required>
                    <label for="password">Password</label>
                </div>
                
                <button type="submit" class="login-btn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
            
            <!-- Action Links -->
            <div class="action-links">
                <a href="#" class="forgot-password" id="forgotPassword">Forgot Password?</a>
                <div class="divider">
                    <span>or</span>
                </div>
                <a href="#" class="create-account" id="createAccount">Create New Account</a>
            </div>
        </div>
    </div>
    
    <!-- Modal for Create Account -->
    <div class="modal" id="createAccountModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Account</h2>
            <p class="role-info" id="roleInfo">Creating account for: <span id="selectedRole">Student</span></p>
            
            <form class="signup-form" id="signupForm">
                <div class="input-group">
                    <input type="text" id="fullName" required>
                    <label for="fullName">Full Name</label>
                </div>
                
                <div class="input-group">
                    <input type="email" id="signupEmail" required>
                    <label for="signupEmail">Email Address</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="signupPassword" required>
                    <label for="signupPassword">Password</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="confirmPassword" required>
                    <label for="confirmPassword">Confirm Password</label>
                </div>
                
                <button type="submit" class="signup-btn">Create Account</button>
            </form>
        </div>
    </div>
    
    <!-- Modal for Forgot Password -->
    <div class="modal" id="forgotPasswordModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <p class="role-info">Reset password for: <span id="resetRole">Student</span></p>
            
            <form class="reset-form" id="resetForm">
                <div class="input-group">
                    <input type="email" id="resetEmail" required>
                    <label for="resetEmail">Email Address</label>
                </div>
                
                <button type="submit" class="reset-btn">Send Reset Link</button>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
